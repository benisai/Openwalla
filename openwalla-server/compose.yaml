services:
  openwalla-server:
    build: .
    container_name: openwalla-server
    restart: unless-stopped
    ports:
      - "${OPENWALLA_API_PORT:-2020}:8080"
    environment:
      OPENWALLA_NETIFY_HOST: "${OPENWALLA_NETIFY_HOST:-192.168.1.1}"
      OPENWALLA_NETIFY_PORT: "${OPENWALLA_NETIFY_PORT:-7150}"
      OPENWALLA_ROUTER_LAN_IP: "${OPENWALLA_ROUTER_LAN_IP:-192.168.1.1}"
      OPENWALLA_RETENTION_HOURS: "${OPENWALLA_RETENTION_HOURS:-24}"
      OPENWALLA_API_TOKEN: "${OPENWALLA_API_TOKEN:-}"
      OPENWALLA_UI_USERNAME: "${OPENWALLA_UI_USERNAME:-admin}"
      OPENWALLA_UI_PASSWORD: "${OPENWALLA_UI_PASSWORD:-}"
      OPENWALLA_UI_PASSWORD_HASH: "${OPENWALLA_UI_PASSWORD_HASH:-}"
      OPENWALLA_SESSION_SECRET: "${OPENWALLA_SESSION_SECRET:-}"
      OPENWALLA_SESSION_HOURS: "${OPENWALLA_SESSION_HOURS:-24}"
      OPENWALLA_AUTH_MAX_FAILURES: "${OPENWALLA_AUTH_MAX_FAILURES:-5}"
      OPENWALLA_AUTH_WINDOW_SECONDS: "${OPENWALLA_AUTH_WINDOW_SECONDS:-900}"
      OPENWALLA_AUTH_BAN_SECONDS: "${OPENWALLA_AUTH_BAN_SECONDS:-3600}"
      OPENWALLA_AUTH_TRUST_PROXY: "${OPENWALLA_AUTH_TRUST_PROXY:-false}"
      OPENWALLA_AUTH_SECURE_COOKIE: "${OPENWALLA_AUTH_SECURE_COOKIE:-false}"
      OPENWALLA_AUTH_BAN_PATH: "/data/openwalla-auth-bans.json"
      OPENWALLA_TUNNEL_STATUS_HOST: "${OPENWALLA_TUNNEL_STATUS_HOST:-openwalla-tunnel}"
      OPENWALLA_TUNNEL_HTTP_PORT: "${OPENWALLA_TUNNEL_HTTP_PORT:-10080}"
      OPENWALLA_TUNNEL_REMOTE_SSH_PORT: "${OPENWALLA_TUNNEL_REMOTE_SSH_PORT:-10022}"
    volumes:
      - ./data:/data
    networks:
      - openwalla

  openwalla-tunnel:
    profiles: ["tunnel"]
    build:
      context: .
      dockerfile: tunnel/Dockerfile
    container_name: openwalla-tunnel
    restart: unless-stopped
    ports:
      - "${OPENWALLA_TUNNEL_GATEWAY_BIND:-0.0.0.0}:${OPENWALLA_TUNNEL_SSH_PORT:-2222}:22"
      - "${OPENWALLA_TUNNEL_HTTP_BIND:-127.0.0.1}:${OPENWALLA_TUNNEL_HTTP_PORT:-10080}:${OPENWALLA_TUNNEL_HTTP_PORT:-10080}"
      - "${OPENWALLA_TUNNEL_REMOTE_SSH_BIND:-127.0.0.1}:${OPENWALLA_TUNNEL_REMOTE_SSH_PORT:-10022}:${OPENWALLA_TUNNEL_REMOTE_SSH_PORT:-10022}"
    environment:
      OPENWALLA_TUNNEL_USER: "${OPENWALLA_TUNNEL_USER:-openwalla}"
      OPENWALLA_TUNNEL_HTTP_PORT: "${OPENWALLA_TUNNEL_HTTP_PORT:-10080}"
      OPENWALLA_TUNNEL_REMOTE_SSH_PORT: "${OPENWALLA_TUNNEL_REMOTE_SSH_PORT:-10022}"
    volumes:
      - ./tunnel-data/authorized_keys:/config/authorized_keys:ro
      - ./tunnel-data/host-keys:/etc/ssh/keys
    networks:
      - openwalla

networks:
  openwalla:
    name: "${OPENWALLA_DOCKER_NETWORK:-openwalla}"
