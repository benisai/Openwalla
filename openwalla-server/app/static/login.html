<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Openwalla Server</title>
  <style>
    :root { color-scheme: dark; --bg:#151718; --surface:#1d2022; --border:#34393d; --text:#eef1f2; --muted:#a2a9ae; --blue:#66d4bf; --red:#f3a1b4; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:20px; background:var(--bg); color:var(--text); font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(400px,100%); }
    .brand { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:22px; }
    .mark { display:grid; place-items:center; width:38px; height:38px; border-radius:8px; background:var(--blue); color:#07111f; font-size:19px; font-weight:800; }
    h1 { margin:0; font-size:22px; letter-spacing:0; }
    .card { padding:24px; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
    h2 { margin:0 0 5px; font-size:18px; }
    p { margin:0 0 20px; color:var(--muted); }
    label { display:block; margin:14px 0 6px; color:var(--muted); font-size:12px; font-weight:700; }
    input, button { width:100%; min-height:44px; border-radius:6px; font:inherit; }
    input { border:1px solid var(--border); background:#111722; color:var(--text); padding:0 12px; outline:none; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(34,146,255,.14); }
    button { margin-top:20px; border:1px solid var(--blue); background:var(--blue); color:#07111f; font-weight:750; cursor:pointer; }
    .message { display:none; margin-bottom:16px; padding:10px 12px; border:1px solid rgba(255,85,115,.5); border-radius:6px; background:rgba(255,85,115,.08); color:#ffb2c0; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="mark">O</div><h1>Openwalla Server</h1></div>
    <section class="card">
      <h2>Sign in</h2>
      <p>Enter your dashboard credentials.</p>
      <div id="message" class="message" role="alert"></div>
      <form method="post" action="/login">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>
    </section>
  </main>
  <script>
    const parameters = new URLSearchParams(location.search);
    const message = document.getElementById('message');
    if (parameters.has('banned')) {
      const seconds = Math.max(1, Number(parameters.get('banned')) || 1);
      message.textContent = `Too many failed attempts. Try again in about ${Math.ceil(seconds / 60)} minute${seconds > 60 ? 's' : ''}.`;
      message.style.display = 'block';
    } else if (parameters.has('error')) {
      message.textContent = 'The username or password was not accepted.';
      message.style.display = 'block';
    }
  </script>
</body>
</html>
